<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory · routiva CRUD</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Inventory</h1>
      <span class="badge" id="api-badge">connecting…</span>
    </header>

    <section class="stats" id="stats"></section>

    <section class="layout">
      <form class="card" id="product-form">
        <h2 id="form-title">Add product</h2>
        <input type="hidden" id="id" />
        <label>Name<input id="name" required placeholder="Wireless Mouse" /></label>
        <label>SKU<input id="sku" required placeholder="MS-200" /></label>
        <div class="row">
          <label>Price<input id="price" type="number" step="0.01" min="0" required placeholder="34.50" /></label>
          <label>Stock<input id="stock" type="number" step="1" min="0" required placeholder="10" /></label>
        </div>
        <label>Category<input id="category" placeholder="peripherals" /></label>
        <div class="actions">
          <button type="submit" id="submit-btn">Create</button>
          <button type="button" id="reset-btn" class="ghost" hidden>Cancel</button>
        </div>
        <p class="form-error" id="form-error" hidden></p>
      </form>

      <div class="card list-card">
        <div class="toolbar">
          <input id="search" placeholder="Search name or SKU…" />
          <select id="category-filter"><option value="">All categories</option></select>
          <select id="sort">
            <option value="created">Newest id</option>
            <option value="name">Name</option>
            <option value="price">Price</option>
            <option value="stock">Stock</option>
          </select>
        </div>
        <table>
          <thead>
            <tr><th>Name</th><th>SKU</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
