<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · routiva docs</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#0c0d0e">
  <meta name="generator" content="routiva docs generator">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="routiva">
  <meta property="og:title" content="{{TITLE}} · routiva docs">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="page">
    <header class="topbar">
      <button class="hamburger" data-menu-toggle aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a class="brand" href="index.html">
        <span class="mark">r</span>
        <span>routiva</span>
        <span class="ver">docs</span>
      </a>
      <div class="spacer"></div>
      <button class="search-trigger" data-search-open aria-label="Search documentation">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="label">Search documentation</span>
        <span class="kbd">⌘K</span>
      </button>
      <nav class="topbar-links">
        <a href="index.html">Home</a>
        <a class="hide-sm" href="https://github.com/uditc0derr/routiva" target="_blank" rel="noopener">GitHub</a>
        <a class="hide-sm" href="https://www.npmjs.com/package/routiva" target="_blank" rel="noopener">npm</a>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle color theme" title="Toggle theme">
          <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </header>

    <aside class="sidebar" id="sidebar">
      {{SIDEBAR}}
      <div class="sidebar-foot">
        <a href="https://github.com/uditc0derr/routiva" target="_blank" rel="noopener">GitHub ↗</a>
        <a href="https://www.npmjs.com/package/routiva" target="_blank" rel="noopener">npm ↗</a>
        <a href="https://github.com/uditc0derr/routiva/blob/main/LICENSE" target="_blank" rel="noopener">MIT ↗</a>
      </div>
    </aside>
    <div class="scrim" data-scrim></div>

    <main class="main" id="content">
      <div class="main-inner">
        <article class="article">
          <header class="article-head">
            <div class="eyebrow">{{SECTION}}</div>
            <h1>{{PAGE_TITLE}}</h1>
            <p class="lede">{{DESCRIPTION}}</p>
          </header>
          <div class="prose">{{CONTENT}}</div>
          {{PAGER}}
        </article>
        <aside class="toc" aria-label="On this page">{{TOC}}</aside>
      </div>
    </main>
  </div>

  <div class="search-overlay" role="dialog" aria-modal="true" aria-label="Search documentation">
    <div class="search-modal">
      <div class="search-input-row">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" type="search" placeholder="Search the docs…" autocomplete="off" spellcheck="false">
        <span class="kbd">Esc</span>
      </div>
      <div class="search-results"></div>
      <div class="search-foot">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
        <span><span class="kbd">↵</span> open</span>
        <span><span class="kbd">Esc</span> close</span>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
