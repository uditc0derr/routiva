<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · routiva docs</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="generator" content="routiva docs">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="routiva">
  <meta property="og:title" content="{{TITLE}} · routiva docs">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip-link" href="#doc-content">Skip to content</a>

  <header class="docs-topbar">
    <button class="docs-menu-btn" id="docsMenuBtn" aria-label="Toggle navigation" aria-expanded="false" aria-controls="docsSidebar">
      <span></span><span></span><span></span>
    </button>
    <a class="nav-logo" href="/">
      <span class="logo-mark">r</span>
      <span class="logo-text">routiva</span>
      <span class="logo-tag">docs</span>
    </a>
    <button class="docs-search-trigger" id="docsSearchTrigger" aria-label="Search documentation">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="docs-search-label">Search docs</span>
      <span class="kbd">⌘K</span>
    </button>
    <nav class="docs-topbar-links">
      <a href="/">Home</a>
      <a class="hide-sm" href="{{REPO}}" target="_blank" rel="noopener">GitHub</a>
      <a class="hide-sm" href="{{NPM}}" target="_blank" rel="noopener">npm</a>
    </nav>
  </header>

  <div class="docs-body">
    <aside class="docs-sidebar" id="docsSidebar">
      <nav class="docs-nav" aria-label="Documentation">
        {{SIDEBAR}}
      </nav>
      <div class="docs-sidebar-foot">
        <a href="{{REPO}}" target="_blank" rel="noopener">GitHub ↗</a>
        <a href="{{NPM}}" target="_blank" rel="noopener">npm ↗</a>
        <a href="{{LICENSE}}" target="_blank" rel="noopener">MIT ↗</a>
      </div>
    </aside>
    <div class="docs-scrim" id="docsScrim"></div>

    <main class="docs-main" id="doc-content">
      <div class="docs-main-inner">
        <article class="docs-article">
          <header class="docs-article-head">
            <div class="docs-eyebrow">{{SECTION}}</div>
            <h1>{{PAGE_TITLE}}</h1>
            {{LEDE}}
          </header>
          <div class="docs-prose">{{CONTENT}}</div>
          {{PAGER}}
        </article>
        <aside class="docs-toc" id="docsToc" aria-label="On this page">{{TOC}}</aside>
      </div>
    </main>
  </div>

  <div class="docs-search-overlay" id="docsSearch" role="dialog" aria-modal="true" aria-label="Search documentation" hidden>
    <div class="docs-search-modal">
      <div class="docs-search-input-row">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="docsSearchInput" type="search" placeholder="Search the docs…" autocomplete="off" spellcheck="false">
        <span class="kbd">Esc</span>
      </div>
      <div class="docs-search-results" id="docsSearchResults"></div>
      <div class="docs-search-foot">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
        <span><span class="kbd">↵</span> open</span>
        <span><span class="kbd">Esc</span> close</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/docs.js"></script>
</body>
</html>
